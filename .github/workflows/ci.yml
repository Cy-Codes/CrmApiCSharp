name: CrmApiCSharp CI & End-to-End Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-tests:
    name: Build .NET 10 Solution & Run xUnit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrmApiCSharp
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CrmApiCSharp.slnx

      - name: Build Solution
        run: dotnet build CrmApiCSharp.slnx -c Release --no-restore

      - name: Run xUnit Unit & Component Tests
        run: dotnet test CrmApiCSharp.slnx -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunit-test-results
          path: "**/TestResults/*.trx"
          retention-days: 14

  e2e-bruno-integration-tests:
    name: End-to-End Multi-DB & Bruno API Integration Suite
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CrmApiCSharp
        uses: actions/checkout@v4
        with:
          path: CrmApiCSharp

      - name: Checkout CRMDatabaseMS (SQL Server Schema & Seed)
        uses: actions/checkout@v4
        with:
          repository: Cy-Codes/CRMDatabaseMS
          path: CRMDatabaseMS
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout CRMDatabasePG (PostgreSQL Migrations & Seed)
        uses: actions/checkout@v4
        with:
          repository: Cy-Codes/CRMDatabasePG
          path: CRMDatabasePG
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout crm-infra (dev JWT token minting scripts)
        uses: actions/checkout@v4
        with:
          repository: Cy-Codes/crm-infra
          path: crm-infra
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js & Install Bruno CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install @usebruno/cli
        run: npm install -g @usebruno/cli

      - name: Start SQL Server (CRMDatabaseMS) & PostgreSQL (CRMDatabasePG) Containers
        run: |
          docker compose -f CRMDatabaseMS/docker-compose.yml up -d --build
          docker compose -f CRMDatabasePG/docker-compose.yml up -d --build

      - name: Wait for Both Databases to Deploy Schemas & Seed Data
        run: |
          echo "Waiting for SQL Server (crm-database-ms) initialization..."
          for i in {1..90}; do
            if docker logs crm-database-ms 2>&1 | grep -q "Standard CRM data seeded successfully"; then
              echo "SQL Server ready!"
              break
            fi
            if [ "$i" -eq 90 ]; then
              docker logs crm-database-ms
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for PostgreSQL (crm_database_pg) initialization..."
          for i in {1..60}; do
            if docker logs crm_database_pg 2>&1 | grep -q "PostgreSQL CRM Database is ready for connections"; then
              echo "PostgreSQL ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs crm_database_pg
              exit 1
            fi
            sleep 2
          done

      - name: Verify Database-Level Test Suites on Both Engines
        run: |
          docker exec crm-database-ms /app/Tests/run_tests.sh
          docker exec crm_database_pg /workspace/tests/run_tests.sh

      - name: Build & Launch CrmApiCSharp Server
        working-directory: CrmApiCSharp
        run: |
          dotnet build CrmApiCSharp.slnx -c Release
          nohup dotnet run --no-build -c Release --project src/Api --urls http://localhost:5172 > /tmp/crmapi.log 2>&1 &
          echo $! > /tmp/crmapi.pid

          echo "Waiting for CrmApiCSharp to listen on http://localhost:5172/health..."
          for i in {1..30}; do
            if curl -sf http://localhost:5172/health > /dev/null; then
              echo "CrmApiCSharp is healthy!"
              curl -s http://localhost:5172/health | jq .
              curl -s http://localhost:5172/health/ms | jq .
              curl -s http://localhost:5172/health/pg | jq .
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat /tmp/crmapi.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Bruno API Test Suite against SQL Server (Local-MsSql)
        working-directory: CrmApiCSharp
        run: |
          chmod +x ./bruno/run_tests.sh
          ./bruno/run_tests.sh Local-MsSql

      - name: Run Bruno API Test Suite against PostgreSQL (Local-Postgres)
        working-directory: CrmApiCSharp
        run: |
          ./bruno/run_tests.sh Local-Postgres

      - name: Stop CrmApiCSharp & Tear Down Containers
        if: always()
        run: |
          if [ -f /tmp/crmapi.pid ]; then
            kill $(cat /tmp/crmapi.pid) || true
          fi
          docker compose -f CRMDatabaseMS/docker-compose.yml down -v || true
          docker compose -f CRMDatabasePG/docker-compose.yml down -v || true
